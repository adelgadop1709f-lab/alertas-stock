name: alertas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar en bucle (cada 3 min durante ~50 min)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          END=$((SECONDS + 3000))
          while true; do
            python alerts.py || true
            if ! git diff --quiet state.json; then
              git add state.json
              git commit -m "estado [skip ci]"
              git pull --rebase -q || true
              git push -q || true
            fi
            [ $((SECONDS + 180)) -ge $END ] && break
            sleep 180
          done
      - name: Relanzar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run alertas.yml --repo "$GITHUB_REPOSITORY"
